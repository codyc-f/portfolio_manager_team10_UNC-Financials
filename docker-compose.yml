services:
  mysql:
    image: mysql:8.0
    container_name: portfolio_manager_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_DATABASE: portfolio_manager
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  db-init:
    build:
      context: ./backend
    environment: &backend-environment
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: devpassword
      MYSQL_DATABASE: portfolio_manager
    command: ["python", "table_initializer.py"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    container_name: portfolio_manager_api
    environment: *backend-environment
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ./backend:/app
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: portfolio_manager_frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://api:5001
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql_data:
  frontend_node_modules:
